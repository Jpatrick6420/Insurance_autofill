
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Policy Cancellation Form Filler</title>

<style>
  :root { --accent:#0a4d8c; --line:#d4d9e0; }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: #f3f5f8;
    color: #1c2530;
    line-height: 1.4;
  }

  header {
    background: var(--accent);
    color: #fff;
    padding: 18px 20px;
  }

  header h1 {
    margin: 0;
    font-size: 1.15rem;
  }

  header p {
    margin: 4px 0 0;
    font-size: .85rem;
    opacity: .9;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: .85rem;
    margin-bottom: 5px;
  }

  input[type=text],
  input[type=email],
  input[type=tel] {
    width: 100%;
    padding: 11px 12px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(10,77,140,.15);
  }

  fieldset {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin: 0 0 16px;
    background: #fafbfc;
  }

  legend {
    font-weight: 700;
    font-size: .8rem;
    padding: 0 6px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
    padding: 14px 18px;
    font-size: 1.05rem;
    width: 100%;
  }

  .primary:active {
    transform: translateY(1px);
  }

  .hint {
    font-size: .8rem;
    color: #66707c;
    margin-top: 6px;
  }

  .status {
    margin-top: 14px;
    font-size: .9rem;
    min-height: 1.2em;
  }

  .status.err {
    color: #b00020;
  }

  .status.ok {
    color: #1a7f37;
  }

  .note {
    background: #fff8e6;
    border: 1px solid #f0dca0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .82rem;
    margin-bottom: 16px;
  }
</style>
</head>

<body>

<header>
  <h1>Policy Cancellation Form Filler</h1>
  <p>Complete the information, download the PDF, then send it through DocuSign.</p>
</header>

<main>

  <div class="note">
    <strong>Signature</strong> and <strong>Date Signed</strong> are intentionally left blank.
    The client completes those fields in DocuSign.
  </div>

  <div class="field">
    <label for="name">Name</label>
    <input
      type="text"
      id="name"
      placeholder="First Last"
      autocomplete="off"
    />
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="client@email.com"
      autocomplete="off"
    />
  </div>

  <div class="field">
    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="801-555-1234"
      autocomplete="off"
    />
  </div>

  <div class="field">
    <label for="company">Insurance Carrier(s) Being Cancelled</label>
    <input
      type="text"
      id="company"
      placeholder="e.g. Progressive"
      autocomplete="off"
    />
  </div>

  <fieldset>

    <legend>Policy Number(s)</legend>

    <div class="field">
      <label for="policyHome">Home Policy Number</label>
      <input
        type="text"
        id="policyHome"
        placeholder="e.g. 801636642"
        autocomplete="off"
      />
    </div>

    <div class="field">
      <label for="policyAuto">Auto Policy Number</label>
      <input
        type="text"
        id="policyAuto"
        placeholder="e.g. 12332322"
        autocomplete="off"
      />
    </div>

    <div class="field">
      <label for="policyUmbrella">Umbrella Policy Number</label>
      <input
        type="text"
        id="policyUmbrella"
        placeholder="e.g. 998877"
        autocomplete="off"
      />
    </div>

    <div class="field">
      <label for="policyOther1">Other Policy</label>
      <input
        type="text"
        id="policyOther1"
        placeholder='e.g. Boat# 123456'
        autocomplete="off"
      />
    </div>

    <div class="field" style="margin-bottom:0;">
      <label for="policyOther2">Other Policy</label>
      <input
        type="text"
        id="policyOther2"
        placeholder='e.g. RV# 987654'
        autocomplete="off"
      />
    </div>

  </fieldset>

  <div class="field">
    <label for="cancelDate">Cancellation Effective Date</label>
    <input
      type="text"
      id="cancelDate"
      placeholder="10/01/2026"
      autocomplete="off"
    />
  </div>

  <button class="primary" id="generate">
    Generate &amp; Download Filled PDF
  </button>

  <div class="hint">
    Uses <code>cancellation_form.pdf</code> from the same folder as this page.
  </div>

  <div class="status" id="status"></div>

</main>

<!-- PDF-LIB -->
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
(function () {
  "use strict";

  /*
   * ================================================================
   * SETTINGS
   * ================================================================
   */

  var PDF_FILENAME = "stone ridge cancelation.pdf";
  var OUTPUT_FILENAME = "Policy-Cancellation.pdf";

  var FONT_SIZE = 10;

  /*
   * ================================================================
   * FIELD POSITIONS
   *
   * Coordinates are measured from the TOP LEFT of the PDF.
   *
   * These are the ONLY numbers we should need to adjust if a field
   * needs to move slightly on the finished PDF.
   * ================================================================
   */

var FIELDS = {

  name: {
    x: 60,
    yTop: 160
  },

  email: {
    x: 338,
    yTop: 160
  },

  phone: {
    x: 60,
    yTop: 206
  },

  company: {
    x: 338,
    yTop: 206
  },

  policies: {
    x: 60,
    yTop: 263,
    lineHeight: 16
  },

  cancelDate: {
    x: 60,
    yTop: 373
  },

  linesOfBusiness: {
    x: 338,
    yTop: 373,
    lineHeight: 16
  },

  printedName: {
    x: 465,
    yTop: 533
  }
};


  /*
   * ================================================================
   * BASIC HELPERS
   * ================================================================
   */

  var statusEl = document.getElementById("status");

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className =
      "status" + (cls ? " " + cls : "");
  }


  function val(id) {
    var el = document.getElementById(id);

    return el
      ? el.value.trim()
      : "";
  }


  /*
   * ================================================================
   * BUILD POLICY LIST
   * ================================================================
   */

  function buildPolicies() {

    var policies = [];


    if (val("policyHome")) {

      policies.push({
        line: "Home",
        text: "Home# " + val("policyHome")
      });

    }


    if (val("policyAuto")) {

      policies.push({
        line: "Auto",
        text: "Auto# " + val("policyAuto")
      });

    }


    if (val("policyUmbrella")) {

      policies.push({
        line: "Umbrella",
        text: "Umbrella# " + val("policyUmbrella")
      });

    }


    /*
     * OTHER POLICIES
     *
     * Type these as:
     *
     * Boat# 123456
     * RV# 987654
     * Motorcycle# ABC123
     *
     * Whatever appears before # becomes the Line of Business.
     */

    ["policyOther1", "policyOther2"].forEach(function (id) {

      var text = val(id);

      if (!text) {
        return;
      }

      var line = "Other";

      if (text.indexOf("#") !== -1) {

        var possibleLine =
          text.split("#")[0].trim();

        if (possibleLine) {
          line = possibleLine;
        }

      }

      policies.push({
        line: line,
        text: text
      });

    });


    return policies;
  }


  /*
   * ================================================================
   * DRAWING HELPERS
   * ================================================================
   */

  function drawText(page, pageHeight, font, color, text, field) {

    if (!text) {
      return;
    }

    page.drawText(text, {

      x: field.x,

      y: pageHeight - field.yTop,

      size: FONT_SIZE,

      font: font,

      color: color

    });

  }


  function drawLines(page, pageHeight, font, color, lines, field) {

    if (!lines.length) {
      return;
    }

    lines.forEach(function (text, index) {

      page.drawText(text, {

        x: field.x,

        y:
          pageHeight -
          field.yTop -
          (index * field.lineHeight),

        size: FONT_SIZE,

        font: font,

        color: color

      });

    });

  }


  /*
   * ================================================================
   * GENERATE PDF
   * ================================================================
   */

  async function generate() {

    setStatus("Generating…");


    try {

      if (!window.PDFLib) {

        throw new Error(
          "PDF library failed to load. Check your internet connection and reload."
        );

      }


      /*
       * LOAD cancellation_form.pdf DIRECTLY
       */

      var response =
        await fetch("./" + PDF_FILENAME);


      if (!response.ok) {

        throw new Error(
          "Could not load " +
          PDF_FILENAME +
          ". Make sure it is in the same folder as this HTML file."
        );

      }


      var bytes =
        await response.arrayBuffer();


      var PDFDocument =
        window.PDFLib.PDFDocument;


      var StandardFonts =
        window.PDFLib.StandardFonts;


      var rgb =
        window.PDFLib.rgb;


      var pdfDoc =
        await PDFDocument.load(bytes);


      var pages =
        pdfDoc.getPages();


      if (!pages.length) {

        throw new Error(
          "The cancellation PDF does not contain any pages."
        );

      }


      var page =
        pages[0];


      var pageHeight =
        page.getHeight();


      var font =
        await pdfDoc.embedFont(
          StandardFonts.Helvetica
        );


      var black =
        rgb(0, 0, 0);


      /*
       * ------------------------------------------------------------
       * CLIENT INFORMATION
       * ------------------------------------------------------------
       */

      drawText(
        page,
        pageHeight,
        font,
        black,
        val("name"),
        FIELDS.name
      );


      drawText(
        page,
        pageHeight,
        font,
        black,
        val("email"),
        FIELDS.email
      );


      drawText(
        page,
        pageHeight,
        font,
        black,
        val("phone"),
        FIELDS.phone
      );


      drawText(
        page,
        pageHeight,
        font,
        black,
        val("company"),
        FIELDS.company
      );


      /*
       * ------------------------------------------------------------
       * POLICIES
       * ------------------------------------------------------------
       */

      var policies =
        buildPolicies();


      var policyText =
        policies.map(function (policy) {
          return policy.text;
        });


      drawLines(
        page,
        pageHeight,
        font,
        black,
        policyText,
        FIELDS.policies
      );


      /*
       * ------------------------------------------------------------
       * CANCELLATION DATE
       * ------------------------------------------------------------
       */

      drawText(
        page,
        pageHeight,
        font,
        black,
        val("cancelDate"),
        FIELDS.cancelDate
      );


      /*
       * ------------------------------------------------------------
       * LINE(S) OF BUSINESS
       * ------------------------------------------------------------
       */

      var businessLines =
        policies.map(function (policy) {
          return policy.line;
        });


      drawLines(
        page,
        pageHeight,
        font,
        black,
        businessLines,
        FIELDS.linesOfBusiness
      );


      /*
       * ------------------------------------------------------------
       * PRINTED NAME
       *
       * Automatically copy client's name here.
       *
       * Signature = intentionally blank
       * Date Signed = intentionally blank
       * ------------------------------------------------------------
       */

      drawText(
        page,
        pageHeight,
        font,
        black,
        val("name"),
        FIELDS.printedName
      );


      /*
       * ------------------------------------------------------------
       * SAVE PDF
       * ------------------------------------------------------------
       */

      var out =
        await pdfDoc.save();


      var blob =
        new Blob(
          [out],
          { type: "application/pdf" }
        );


      var url =
        URL.createObjectURL(blob);


      var a =
        document.createElement("a");


      a.href =
        url;


      a.download =
        OUTPUT_FILENAME;


      document.body.appendChild(a);


      a.click();


      document.body.removeChild(a);


      setTimeout(function () {

        URL.revokeObjectURL(url);

      }, 4000);


      setStatus(
        "Done — " +
        OUTPUT_FILENAME +
        " downloaded.",
        "ok"
      );


    } catch (err) {

      console.error(err);


      setStatus(
        err.message || String(err),
        "err"
      );

    }

  }


  /*
   * ================================================================
   * BUTTON
   * ================================================================
   */

  document
    .getElementById("generate")
    .addEventListener(
      "click",
      generate
    );

})();
</script>

</body>
</html>
